---
- name: Discover full DR Garage node identities
  hosts: storage
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
    - name: Read Garage node identity
      ansible.builtin.command:
        argv: [docker, exec, garage, /garage, -c, /etc/garage.toml, node, id, -q]
      register: m11_dr_garage_node_identity
      changed_when: false

    - name: Validate Garage node identity
      ansible.builtin.assert:
        that:
          - (m11_dr_garage_node_identity.stdout.split('@')[0]) is match('^[0-9a-f]{64}$')

- name: Bootstrap fresh full DR Garage cluster
  hosts: storage[0]
  gather_facts: false
  become: true
  any_errors_fatal: true
  vars:
    m11_dr_primary: "{{ groups['storage'][0] }}"
  tasks:
    - name: Require exactly three DR Garage nodes
      ansible.builtin.assert:
        that:
          - groups['storage'] | length == 3

    - name: Connect DR Garage peers to the primary
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - garage
          - /garage
          - -c
          - /etc/garage.toml
          - node
          - connect
          - "{{ hostvars[item].m11_dr_garage_node_identity.stdout.split('@')[0] }}@{{ hostvars[item].ansible_host }}:{{ garage_rpc_port }}"
      loop: "{{ groups['storage'][1:] }}"
      changed_when: true

    - name: Read current DR Garage layout
      ansible.builtin.command:
        argv: [docker, exec, garage, /garage, -c, /etc/garage.toml, layout, show]
      register: m11_dr_garage_layout
      changed_when: false

    - name: Assign unconfigured DR Garage nodes
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - garage
          - /garage
          - -c
          - /etc/garage.toml
          - layout
          - assign
          - "{{ hostvars[item].m11_dr_garage_node_identity.stdout.split('@')[0] }}"
          - -z
          - "{{ hostvars[item].garage_zone }}"
          - -c
          - "{{ m11_dr_garage_layout_capacity | default('25G') }}"
          - -t
          - "{{ item }}"
      loop: "{{ groups['storage'] }}"
      when: >-
        hostvars[item].m11_dr_garage_node_identity.stdout.split('@')[0][0:16]
        not in m11_dr_garage_layout.stdout
      register: m11_dr_garage_assignments

    - name: Read DR Garage layout version before apply
      ansible.builtin.command:
        argv: [docker, exec, garage, /garage, -c, /etc/garage.toml, layout, show]
      register: m11_dr_garage_layout_after_assign
      changed_when: false
      when: m11_dr_garage_assignments is changed

    - name: Apply DR Garage layout
      ansible.builtin.shell: |
        set -euo pipefail
        current_version=$(printf '%s\n' "$GARAGE_LAYOUT" | sed -n 's/^Current cluster layout version: \([0-9][0-9]*\)$/\1/p' | head -1)
        [[ -n "$current_version" ]]
        docker exec garage /garage -c /etc/garage.toml layout apply --version "$((current_version + 1))"
      args:
        executable: /bin/bash
      environment:
        GARAGE_LAYOUT: "{{ m11_dr_garage_layout_after_assign.stdout | default('') }}"
      when: m11_dr_garage_assignments is changed

    - name: Inspect DR Garage application bucket
      ansible.builtin.command:
        argv: [docker, exec, garage, /garage, -c, /etc/garage.toml, bucket, info, "{{ garage_bucket }}"]
      register: m11_dr_bucket_info
      changed_when: false
      failed_when: false

    - name: Create DR Garage application bucket
      ansible.builtin.command:
        argv: [docker, exec, garage, /garage, -c, /etc/garage.toml, bucket, create, "{{ garage_bucket }}"]
      when: m11_dr_bucket_info.rc != 0

    - name: Inspect DR Garage application key
      ansible.builtin.command:
        argv: [docker, exec, garage, /garage, -c, /etc/garage.toml, key, info, "{{ garage_app_access_key }}"]
      register: m11_dr_key_info
      changed_when: false
      failed_when: false
      no_log: true

    - name: Import DR Garage application key
      ansible.builtin.shell: |
        set -euo pipefail
        docker exec garage /garage -c /etc/garage.toml key import           -n arp-application --yes "$GARAGE_ACCESS_KEY" "$GARAGE_SECRET_KEY"
      args:
        executable: /bin/bash
      environment:
        GARAGE_ACCESS_KEY: "{{ garage_app_access_key }}"
        GARAGE_SECRET_KEY: "{{ garage_app_secret_key }}"
      when: m11_dr_key_info.rc != 0
      no_log: true

    - name: Allow application access to DR Garage bucket
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - garage
          - /garage
          - -c
          - /etc/garage.toml
          - bucket
          - allow
          - --read
          - --write
          - --owner
          - "{{ garage_bucket }}"
          - --key
          - "{{ garage_app_access_key }}"
      no_log: true

- name: Restore verified checkpoint objects from backup-01 into full DR Garage
  hosts: backup
  gather_facts: false
  become: true
  any_errors_fatal: true
  vars:
    m11_dr_garage_endpoint: "http://{{ hostvars[groups['storage'][0]].ansible_host }}:{{ garage_s3_port }}"
    m11_checkpoint_root: "/srv/backup/objects/checkpoints/{{ m11_checkpoint_id }}"
    m11_object_root: "{{ m11_checkpoint_root }}/data"
    m11_manifest_path: "{{ m11_checkpoint_root }}/manifest.json"
    m11_restore_secret_file: /run/arp-m11-garage-restore.env
  tasks:
    - name: Validate full DR object restore inputs
      ansible.builtin.assert:
        that:
          - m11_checkpoint_id is match('^[A-Za-z0-9._-]+$')
          - m11_manifest_sha256 is match('^[0-9a-f]{64}$')
          - garage_app_access_key | length > 0
          - garage_app_secret_key | length > 0
      no_log: true

    - name: Install full DR Garage object restore tool
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../scripts/restore/garage_object_restore.py"
        dest: /usr/local/lib/arp/garage_object_restore.py
        owner: root
        group: pgbackrest
        mode: '0750'

    - name: Restore checkpoint objects with temporary credentials
      block:
        - name: Write temporary Garage restore credential file
          ansible.builtin.copy:
            dest: "{{ m11_restore_secret_file }}"
            owner: pgbackrest
            group: pgbackrest
            mode: '0600'
            content: |
              GARAGE_ACCESS_KEY={{ garage_app_access_key }}
              GARAGE_SECRET_KEY={{ garage_app_secret_key }}
          no_log: true

        - name: Restore and re-verify all checkpoint objects
          ansible.builtin.shell: |
            set -euo pipefail
            . "{{ m11_restore_secret_file }}"
            export GARAGE_ACCESS_KEY GARAGE_SECRET_KEY
            /usr/bin/python3 /usr/local/lib/arp/garage_object_restore.py               --endpoint "{{ m11_dr_garage_endpoint }}"               --bucket "{{ garage_bucket }}"               --root "{{ m11_object_root }}"               --manifest "{{ m11_manifest_path }}"               --manifest-sha256 "{{ m11_manifest_sha256 }}"
          args:
            executable: /bin/bash
          become_user: pgbackrest
          register: m11_full_dr_object_restore
          changed_when: true

        - name: Report sanitized full DR object restore result
          ansible.builtin.debug:
            var: m11_full_dr_object_restore.stdout_lines
      always:
        - name: Remove temporary Garage restore credential file
          ansible.builtin.file:
            path: "{{ m11_restore_secret_file }}"
            state: absent
          no_log: true
