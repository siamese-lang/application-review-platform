---
- name: Install PostgreSQL
  ansible.builtin.apt: { name: [postgresql, postgresql-client], state: present }
- name: Create database mount
  ansible.builtin.file: { path: /srv/postgresql, state: directory, owner: postgres, group: postgres, mode: '0700' }
- name: Format uninitialized database disk
  community.general.filesystem: { fstype: ext4, dev: /dev/disk/by-id/google-arp-data }
- name: Mount database disk
  ansible.posix.mount: { path: /srv/postgresql, src: /dev/disk/by-id/google-arp-data, fstype: ext4, opts: "defaults,noatime", state: mounted }
- name: Restore PostgreSQL ownership after mounting
  ansible.builtin.file: { path: /srv/postgresql, state: directory, owner: postgres, group: postgres, mode: '0700' }
- name: Find PostgreSQL major version
  ansible.builtin.shell: "set -o pipefail && pg_config --version | awk '{print $2}' | cut -d. -f1"
  args: { executable: /bin/bash }
  register: pg_major
  changed_when: false
- name: Initialize PostgreSQL data directory once
  ansible.builtin.command: "sudo -u postgres /usr/lib/postgresql/{{ pg_major.stdout }}/bin/initdb -D /srv/postgresql/data --auth-host=scram-sha-256 --auth-local=peer"
  args: { creates: /srv/postgresql/data/PG_VERSION }
- name: Configure private PostgreSQL access
  ansible.builtin.template: { src: postgresql.conf.j2, dest: "/etc/postgresql/{{ pg_major.stdout }}/main/conf.d/arp.conf", owner: postgres, group: postgres, mode: '0644' }
  notify: Restart PostgreSQL
- name: Configure restrictive client authentication
  ansible.builtin.template: { src: pg_hba.conf.j2, dest: "/etc/postgresql/{{ pg_major.stdout }}/main/pg_hba.conf", owner: postgres, group: postgres, mode: '0640' }
  notify: Restart PostgreSQL
- name: Flush PostgreSQL configuration
  ansible.builtin.meta: flush_handlers
- name: Create application database and role without rotating an existing password
  ansible.builtin.shell: |
    set -euo pipefail
    role_exists=$(sudo -u postgres psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='arp_app'")
    if [ "$role_exists" != 1 ]; then
      sudo -u postgres psql -v ON_ERROR_STOP=1 --set=password="$DB_PASSWORD" <<'SQL'
    CREATE ROLE arp_app LOGIN PASSWORD :'password';
    SQL
    fi
    db_exists=$(sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='arp'")
    [ "$db_exists" = 1 ] || sudo -u postgres createdb --owner=arp_app arp
  args: { executable: /bin/bash }
  environment: { DB_PASSWORD: "{{ db_app_password }}" }
  no_log: true

- name: Create dedicated PostgreSQL monitoring role
  ansible.builtin.shell: |
    set -euo pipefail
    role_exists=$(sudo -u postgres psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='arp_monitor'")
    changed=false

    if [ "$role_exists" != 1 ]; then
      sudo -u postgres psql -v ON_ERROR_STOP=1 --set=password="$DB_MONITOR_PASSWORD" <<'SQL'
    CREATE ROLE arp_monitor
      LOGIN
      INHERIT
      NOSUPERUSER
      NOCREATEDB
      NOCREATEROLE
      NOREPLICATION
      NOBYPASSRLS
      CONNECTION LIMIT 5
      PASSWORD :'password';
    SQL
      changed=true
    fi

    sudo -u postgres psql -v ON_ERROR_STOP=1 -d postgres <<'SQL'
    ALTER ROLE arp_monitor
      INHERIT
      NOSUPERUSER
      NOCREATEDB
      NOCREATEROLE
      NOREPLICATION
      NOBYPASSRLS
      CONNECTION LIMIT 5;
    SQL

    has_monitor=$(sudo -u postgres psql -tAc "SELECT pg_has_role('arp_monitor','pg_monitor','MEMBER')" postgres)
    if [ "$has_monitor" != t ]; then
      sudo -u postgres psql -v ON_ERROR_STOP=1 -d postgres -c "GRANT pg_monitor TO arp_monitor"
      changed=true
    fi

    has_connect=$(sudo -u postgres psql -tAc "SELECT has_database_privilege('arp_monitor','arp','CONNECT')" postgres)
    if [ "$has_connect" != t ]; then
      sudo -u postgres psql -v ON_ERROR_STOP=1 -d postgres -c "GRANT CONNECT ON DATABASE arp TO arp_monitor"
      changed=true
    fi

    if [ "$changed" = true ]; then
      echo changed
    else
      echo unchanged
    fi
  args: { executable: /bin/bash }
  environment:
    DB_MONITOR_PASSWORD: "{{ db_monitor_password }}"
  register: postgres_monitor_role
  changed_when: "'changed' in postgres_monitor_role.stdout_lines"
  no_log: true
