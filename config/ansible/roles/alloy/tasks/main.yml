---
- name: Resolve Alloy node role label
  ansible.builtin.set_fact:
    alloy_node_role: >-
      {{ 'edge' if 'edge' in group_names
         else 'app' if 'app' in group_names
         else 'db' if 'db' in group_names
         else 'storage' if 'storage' in group_names
         else 'observability' if 'observability' in group_names
         else 'unsupported' }}

- name: Reject unsupported Alloy placement
  ansible.builtin.assert:
    that:
      - alloy_node_role != 'unsupported'
    fail_msg: Alloy is only supported on edge/app/db/storage/observability nodes in M7 Phase 3.

- name: Install Alloy archive dependency
  ansible.builtin.apt:
    name: unzip
    state: present

- name: Create Alloy system user
  ansible.builtin.user:
    name: alloy
    system: true
    shell: /usr/sbin/nologin
    home: /nonexistent
    create_home: false

- name: Create Alloy directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: /etc/alloy, owner: root, group: alloy, mode: '0750' }
    - { path: /var/lib/alloy, owner: alloy, group: alloy, mode: '0750' }
    - { path: "/opt/alloy-{{ alloy_version }}", owner: root, group: root, mode: '0755' }

- name: Download pinned Alloy release
  ansible.builtin.get_url:
    url: "https://github.com/grafana/alloy/releases/download/v{{ alloy_version }}/alloy-linux-amd64.zip"
    dest: "/tmp/alloy-linux-amd64-{{ alloy_version }}.zip"
    checksum: "sha256:{{ alloy_linux_amd64_sha256 }}"
    mode: '0644'

- name: Extract pinned Alloy release
  ansible.builtin.unarchive:
    src: "/tmp/alloy-linux-amd64-{{ alloy_version }}.zip"
    dest: "/opt/alloy-{{ alloy_version }}"
    remote_src: true
    creates: "/opt/alloy-{{ alloy_version }}/alloy-linux-amd64"

- name: Ensure extracted Alloy binary is executable
  ansible.builtin.file:
    path: "/opt/alloy-{{ alloy_version }}/alloy-linux-amd64"
    owner: root
    group: root
    mode: '0755'

- name: Link Alloy binary
  ansible.builtin.file:
    src: "/opt/alloy-{{ alloy_version }}/alloy-linux-amd64"
    dest: /usr/local/bin/alloy
    state: link
    force: true

- name: Install repository-owned Alloy baseline configuration
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../monitoring/alloy/config.alloy"
    dest: /etc/alloy/config.alloy
    owner: root
    group: alloy
    mode: '0640'
  notify: Restart Alloy

- name: Install observability-only application health probe Alloy configuration
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../monitoring/alloy/observability-probe.alloy"
    dest: /etc/alloy/observability-probe.alloy
    owner: root
    group: alloy
    mode: '0640'
  when: alloy_node_role == 'observability'
  notify: Restart Alloy

- name: Remove observability-only application health probe from non-observability nodes
  ansible.builtin.file:
    path: /etc/alloy/observability-probe.alloy
    state: absent
  when: alloy_node_role != 'observability'
  notify: Restart Alloy

- name: Create role-specific Alloy secret directory
  ansible.builtin.file:
    path: /etc/alloy/secrets
    state: directory
    owner: root
    group: alloy
    mode: '0750'
  when: alloy_node_role in ['db', 'storage']

- name: Install app-only application log Alloy configuration
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../monitoring/alloy/app-logs.alloy"
    dest: /etc/alloy/app-logs.alloy
    owner: root
    group: alloy
    mode: '0640'
  when: alloy_node_role == 'app'
  notify: Restart Alloy

- name: Remove app-only Alloy log configuration from non-app nodes
  ansible.builtin.file:
    path: /etc/alloy/app-logs.alloy
    state: absent
  when: alloy_node_role != 'app'
  notify: Restart Alloy

- name: Install db-only PostgreSQL monitoring password
  ansible.builtin.copy:
    content: "{{ db_monitor_password }}"
    dest: /etc/alloy/secrets/postgres-monitor-password
    owner: root
    group: alloy
    mode: '0640'
  when: alloy_node_role == 'db'
  no_log: true
  notify: Restart Alloy

- name: Install db-only PostgreSQL Alloy configuration
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../monitoring/alloy/postgres.alloy"
    dest: /etc/alloy/postgres.alloy
    owner: root
    group: alloy
    mode: '0640'
  when: alloy_node_role == 'db'
  notify: Restart Alloy

- name: Remove db-only Alloy files from non-db nodes
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/alloy/postgres.alloy
    - /etc/alloy/secrets/postgres-monitor-password
  when: alloy_node_role != 'db'
  notify: Restart Alloy

- name: Install storage-only Garage metrics token
  ansible.builtin.copy:
    content: "{{ garage_metrics_token }}"
    dest: /etc/alloy/secrets/garage-metrics-token
    owner: root
    group: alloy
    mode: '0640'
  when: alloy_node_role == 'storage'
  no_log: true
  notify: Restart Alloy

- name: Install storage-only Garage Alloy configuration
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../monitoring/alloy/garage.alloy"
    dest: /etc/alloy/garage.alloy
    owner: root
    group: alloy
    mode: '0640'
  when: alloy_node_role == 'storage'
  notify: Restart Alloy

- name: Remove storage-only Alloy files from non-storage nodes
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/alloy/garage.alloy
    - /etc/alloy/secrets/garage-metrics-token
  when: alloy_node_role != 'storage'
  notify: Restart Alloy

- name: Install Alloy systemd unit
  ansible.builtin.template:
    src: alloy.service.j2
    dest: /etc/systemd/system/alloy.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd
    - Restart Alloy

- name: Enable Alloy service
  ansible.builtin.systemd_service:
    name: alloy
    enabled: true
    state: started
    daemon_reload: true
