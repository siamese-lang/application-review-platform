---
- name: Create Alertmanager system user
  ansible.builtin.user:
    name: alertmanager
    system: true
    shell: /usr/sbin/nologin
    home: /nonexistent
    create_home: false

- name: Create Alertmanager directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: /etc/alertmanager, owner: root, group: alertmanager, mode: '0750' }
    - { path: /srv/observability/alertmanager, owner: alertmanager, group: alertmanager, mode: '0750' }

- name: Download pinned Alertmanager release
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/alertmanager/releases/download/v{{ alertmanager_version }}/alertmanager-{{ alertmanager_version }}.linux-amd64.tar.gz"
    dest: "/tmp/alertmanager-{{ alertmanager_version }}.linux-amd64.tar.gz"
    checksum: "sha256:{{ alertmanager_linux_amd64_sha256 }}"
    mode: '0644'

- name: Extract pinned Alertmanager release
  ansible.builtin.unarchive:
    src: "/tmp/alertmanager-{{ alertmanager_version }}.linux-amd64.tar.gz"
    dest: /opt
    remote_src: true
    creates: "/opt/alertmanager-{{ alertmanager_version }}.linux-amd64/alertmanager"

- name: Link Alertmanager binary
  ansible.builtin.file:
    src: "/opt/alertmanager-{{ alertmanager_version }}.linux-amd64/alertmanager"
    dest: /usr/local/bin/alertmanager
    state: link
    force: true

- name: Link amtool binary
  ansible.builtin.file:
    src: "/opt/alertmanager-{{ alertmanager_version }}.linux-amd64/amtool"
    dest: /usr/local/bin/amtool
    state: link
    force: true

- name: Install repository-owned Alertmanager configuration
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../monitoring/alertmanager/alertmanager.yml"
    dest: /etc/alertmanager/alertmanager.yml
    owner: root
    group: alertmanager
    mode: '0640'
  notify: Restart Alertmanager

- name: Install Alertmanager systemd unit
  ansible.builtin.template:
    src: alertmanager.service.j2
    dest: /etc/systemd/system/alertmanager.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd
    - Restart Alertmanager

- name: Enable Alertmanager service
  ansible.builtin.systemd_service:
    name: alertmanager
    enabled: true
    state: started
    daemon_reload: true
