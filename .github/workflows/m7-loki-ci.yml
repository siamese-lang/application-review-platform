name: m7-loki-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  m7-loki-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate M7 Loki repository contract
        run: bash scripts/deploy/test-m7-loki-config.sh
      - name: Validate Loki configuration with pinned Loki
        run: |
          docker run --rm \
            -v "$PWD/monitoring/loki:/etc/loki:ro" \
            grafana/loki:3.7.7 \
            -config.file=/etc/loki/loki.yml \
            -verify-config=true
