name: m7-tempo-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  m7-tempo-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate M7 Tempo repository contract
        run: bash scripts/deploy/test-m7-tempo-config.sh
      - name: Validate Tempo configuration with pinned Tempo
        run: |
          docker run --rm \
            -v "$PWD/monitoring/tempo:/etc/tempo:ro" \
            grafana/tempo:3.0.2 \
            -target=all \
            -config.file=/etc/tempo/tempo.yml \
            -config.verify
