name: baseline-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify M0 repository baseline
        run: bash scripts/verify-repo-baseline.sh
  m1-application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: application_review_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d application_review_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify application
        run: ./mvnw verify
      - name: Print Surefire reports on failure
        if: failure()
        run: |
          for report in app/target/surefire-reports/*.txt; do
            [ -f "$report" ] || continue
            echo "===== $report ====="
            cat "$report"
          done
