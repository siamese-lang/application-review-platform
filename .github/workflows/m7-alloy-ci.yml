name: m7-alloy-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  m7-alloy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate M7 Alloy repository contract
        run: bash scripts/deploy/test-m7-alloy-config.sh
      - name: Validate Alloy configuration with pinned Alloy
        run: |
          docker run --rm \
            -v "$PWD/monitoring/alloy:/etc/alloy:ro" \
            grafana/alloy:v1.18.1 \
            validate /etc/alloy/config.alloy
