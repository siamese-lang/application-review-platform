name: m7-grafana-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  m7-grafana-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate M7 Grafana repository contract
        run: bash scripts/deploy/test-m7-grafana-config.sh
      - name: Validate Grafana datasource provisioning with pinned Grafana
        run: |
          set -euo pipefail
          docker run -d --name m7-grafana-ci --network host \
            -e GF_SERVER_HTTP_ADDR=127.0.0.1 \
            -e GF_SECURITY_ADMIN_USER=admin \
            -e GF_SECURITY_ADMIN_PASSWORD=ci-only \
            -e GF_USERS_ALLOW_SIGN_UP=false \
            -e GF_AUTH_ANONYMOUS_ENABLED=false \
            -v "$PWD/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro" \
            grafana/grafana:13.2.1

          cleanup() {
            docker logs m7-grafana-ci || true
            docker rm -f m7-grafana-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true

          curl -fsS -u admin:ci-only http://127.0.0.1:3000/api/datasources/uid/prometheus >/dev/null
          curl -fsS -u admin:ci-only http://127.0.0.1:3000/api/datasources/uid/loki >/dev/null
          curl -fsS -u admin:ci-only http://127.0.0.1:3000/api/datasources/uid/tempo >/dev/null
