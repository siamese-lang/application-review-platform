<!doctype html><html><head><title>Review</title></head><body><main><h1 th:text="${application.title}"></h1><p th:text="${application.content}"></p><p>Status: <strong th:text="${application.status}"></strong></p><form method="post" th:if="${application.status.name() == 'SUBMITTED'}" th:action="@{/review/{id}/start(id=${application.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button>Start review</button></form><form method="post" th:if="${application.status.name() == 'IN_REVIEW'}" th:action="@{/review/{id}/decision(id=${application.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Reason <textarea name="reason"></textarea></label><button name="decision" value="NEEDS_REVISION">Request revision</button><button name="decision" value="APPROVED">Approve</button><button name="decision" value="REJECTED">Reject</button></form><h2>Attachments</h2><ul><li th:each="a:${attachments}"><a th:if="${a.status.name() == 'AVAILABLE'}" th:href="@{/review/{id}/attachments/{aid}(id=${application.id},aid=${a.id})}" th:text="${a.originalFilename}"></a><span th:unless="${a.status.name() == 'AVAILABLE'}" th:text="${a.originalFilename + ' (' + a.status + ')'}"></span></li></ul><h2>History</h2><ul><li th:each="h:${history}"><span th:text="${h.fromStatus}"></span> → <span th:text="${h.toStatus}"></span> by <span th:text="${h.changedBy.username}"></span>: <span th:text="${h.reason}"></span></li></ul><a href="/review">Back</a></main></body></html>
