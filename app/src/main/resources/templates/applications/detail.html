<!doctype html><html><head><title>Application</title></head><body><main>
<h1 th:text="${applicationRecord.title}"></h1><p>Status: <strong th:text="${applicationRecord.status}"></strong></p>
<form method="post" th:if="${applicationRecord.status.name() == 'DRAFT' or applicationRecord.status.name() == 'NEEDS_REVISION'}" th:action="@{/applications/{id}/edit(id=${applicationRecord.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Title <input name="title" th:value="${applicationRecord.title}" required></label><label>Content <textarea name="content" th:text="${applicationRecord.content}" required></textarea></label><button>Save</button></form>
<form method="post" th:if="${applicationRecord.status.name() == 'DRAFT' or applicationRecord.status.name() == 'NEEDS_REVISION'}" th:action="@{/applications/{id}/submit(id=${applicationRecord.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button>Submit</button></form>
<h2>Attachments</h2><ul><li th:each="a:${attachments}"><a th:if="${a.status.name() == 'AVAILABLE'}" th:href="@{/applications/{id}/attachments/{aid}(id=${applicationRecord.id},aid=${a.id})}" th:text="${a.originalFilename}"></a><span th:unless="${a.status.name() == 'AVAILABLE'}" th:text="${a.originalFilename + ' (' + a.status + ')'}"></span><form method="post" style="display:inline" th:if="${applicationRecord.status.name() == 'DRAFT' or applicationRecord.status.name() == 'NEEDS_REVISION'}" th:action="@{/applications/{id}/attachments/{aid}/delete(id=${applicationRecord.id},aid=${a.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button>Delete</button></form></li></ul>
<form method="post" enctype="multipart/form-data" th:if="${applicationRecord.status.name() == 'DRAFT' or applicationRecord.status.name() == 'NEEDS_REVISION'}" th:action="@{/applications/{id}/attachments(id=${applicationRecord.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="file" name="file" required><button>Upload</button></form>
<h2>History</h2><ul><li th:each="h:${history}"><span th:text="${h.fromStatus}"></span> → <span th:text="${h.toStatus}"></span> <span th:text="${h.reason}"></span></li></ul><a href="/applications">Back</a></main></body></html>
