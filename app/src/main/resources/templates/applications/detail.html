<!doctype html><html><head><title>Application</title></head><body><main><h1 th:text="${application.title}"></h1><p>Status: <strong th:text="${application.status}"></strong></p><form method="post" th:if="${application.status.name() == 'DRAFT' or application.status.name() == 'NEEDS_REVISION'}" th:action="@{/applications/{id}/edit(id=${application.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Title <input name="title" th:value="${application.title}" required></label><label>Content <textarea name="content" th:text="${application.content}" required></textarea></label><button>Save</button></form><form method="post" th:if="${application.status.name() == 'DRAFT' or application.status.name() == 'NEEDS_REVISION'}" th:action="@{/applications/{id}/submit(id=${application.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button>Submit</button></form><h2>History</h2><ul><li th:each="h:${history}"><span th:text="${h.fromStatus}"></span> → <span th:text="${h.toStatus}"></span> <span th:text="${h.reason}"></span></li></ul><a href="/applications">Back</a></main></body></html>
