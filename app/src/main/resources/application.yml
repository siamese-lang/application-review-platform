server:
  forward-headers-strategy: framework
spring:
  application:
    name: application-review-platform
  servlet:
    multipart:
      max-file-size: ${ATTACHMENT_MAX_FILE_SIZE:10MB}
      max-request-size: ${ATTACHMENT_MAX_REQUEST_SIZE:12MB}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/application_review}
    username: ${DB_USERNAME:application_review}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  session:
    jdbc:
      initialize-schema: never
storage:
  garage:
    endpoint: ${GARAGE_ENDPOINT:http://localhost:3900}
    bucket: ${GARAGE_BUCKET:application-review}
    region: ${GARAGE_REGION:garage}
    access-key: ${GARAGE_ACCESS_KEY:development-access-key}
    secret-key: ${GARAGE_SECRET_KEY:development-secret-key}
    path-style: ${GARAGE_PATH_STYLE:true}
    managed-prefix: ${GARAGE_MANAGED_PREFIX:application-review/attachments/}
attachment:
  reconciliation:
    stale-after: ${ATTACHMENT_STALE_AFTER:PT15M}
    schedule: ${ATTACHMENT_RECONCILIATION_SCHEDULE:0 */10 * * * *}

management:
  server:
    address: 127.0.0.1
    port: ${MANAGEMENT_SERVER_PORT:9091}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_TRACES_ENDPOINT:http://127.0.0.1:4318/v1/traces}
