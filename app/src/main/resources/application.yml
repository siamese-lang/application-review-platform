spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/application_review}
    username: ${DB_USERNAME:application_review}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  session:
    jdbc:
      initialize-schema: never
